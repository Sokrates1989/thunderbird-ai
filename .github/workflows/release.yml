name: Build and publish Thunderbird release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thunderbird-ai-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release version
    if: github.repository == 'Sokrates1989/thunderbird-ai' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release_needed: ${{ steps.metadata.outputs.release_needed }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the supported Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Resolve manifest version and existing release
        id: metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./thunderbird-ai/manifest.json").version')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Manifest version is not semantic: %s\n' "$version" >&2
            exit 1
          fi
          tag="v${version}"
          release_state="$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          release_needed=true
          if [[ "$release_state" == 'false' ]]; then
            release_needed=false
          fi
          {
            printf 'version=%s\n' "$version"
            printf 'tag=%s\n' "$tag"
            printf 'release_needed=%s\n' "$release_needed"
          } >> "$GITHUB_OUTPUT"

  xpi-source:
    name: Test and build XPI/source
    needs: prepare
    if: needs.prepare.outputs.release_needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the supported Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Run extension tests
        run: npm test

      - name: Build release XPI and reviewer source
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          ./build-addon.sh --output "artifacts/thunderbird-ai-${VERSION}.xpi"
          cp -p "artifacts/thunderbird-ai-${VERSION}.xpi" artifacts/thunderbird-ai.xpi
          ./scripts/build-atn-source.sh

      - name: Reject new ATN validation findings
        run: npm run lint:atn -- "artifacts/thunderbird-ai-${{ needs.prepare.outputs.version }}.xpi"

      - name: Upload XPI and reviewer source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xpi-source-${{ needs.prepare.outputs.version }}
          if-no-files-found: error
          path: |
            artifacts/thunderbird-ai-${{ needs.prepare.outputs.version }}.xpi
            artifacts/thunderbird-ai.xpi
            artifacts/thunderbird-ai-${{ needs.prepare.outputs.version }}-atn-source.zip

  release:
    name: Publish GitHub release
    needs:
      - prepare
      - xpi-source
    if: needs.prepare.outputs.release_needed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          path: release-assets

      - name: Verify complete artifact set and create checksums
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          expected_files=(
            "thunderbird-ai-${VERSION}.xpi"
            'thunderbird-ai.xpi'
            "thunderbird-ai-${VERSION}-atn-source.zip"
          )
          for expected_file in "${expected_files[@]}"; do
            [[ -f "release-assets/${expected_file}" ]] || {
              printf 'Missing release asset: %s\n' "$expected_file" >&2
              exit 1
            }
          done
          cmp "release-assets/thunderbird-ai-${VERSION}.xpi" release-assets/thunderbird-ai.xpi
          (
            cd release-assets
            find . -maxdepth 1 -type f -print0 |
              LC_ALL=C sort -z |
              xargs -0 shasum -a 256 |
              sed 's#  \./#  #' > "SHA256SUMS-${VERSION}.txt"
            cp -p "SHA256SUMS-${VERSION}.txt" SHA256SUMS.txt
          )

      - name: Create or resume the draft and publish it as latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          release_files=(release-assets/*)
          release_state="$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          if [[ "$release_state" == 'true' ]]; then
            gh release upload "$TAG" "${release_files[@]}" --clobber
          else
            gh release create "$TAG" "${release_files[@]}" \
              --draft \
              --generate-notes \
              --target "$GITHUB_SHA" \
              --title "Thunderbird AI ${VERSION}"
          fi
          gh release edit "$TAG" --draft=false --latest --title "Thunderbird AI ${VERSION}"
