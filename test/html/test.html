<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Test</title>
    <link rel="stylesheet" href="test.css">
</head>
<body>
    <div class="container">
        <h1>🧪 Simple Test</h1>
        <p>Teste die grundlegende Funktionalität:</p>
        
        <button id="alertTestBtn">Alert Test</button>
        <button id="consoleTestBtn">Console Test</button>
        <button class="test-btn" id="backgroundTestBtn">Background Test</button>
        <button id="clearLogBtn">Log löschen</button>
        
        <div class="status" id="status">
            Status: Bereit zum Testen
        </div>
        
        <div class="console-output" id="consoleOutput">
            Console-Ausgabe wird hier angezeigt...
        </div>
    </div>

    <script src="test.js"></script>
</body>
</html>
