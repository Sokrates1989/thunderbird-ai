<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant</title>
    <link rel="stylesheet" href="message-display.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 AI Assistant</h1>
            <div class="subtitle" id="emailSubject">E-Mail wird geladen...</div>
        </div>

        <div class="section">
            <h2>🚀 Schnellaktionen</h2>
            <div class="button-grid">
                <button class="button primary" id="summarizeBtn">
                    <span class="icon">📄</span>
                    <span class="text">Zusammenfassen</span>
                    <span class="shortcut">Strg+Alt+S</span>
                </button>
                
                <button class="button" id="replyBtn">
                    <span class="icon">✍️</span>
                    <span class="text">Antwort vorschlagen</span>
                    <span class="shortcut">Strg+Alt+R</span>
                </button>
                
                <button class="button" id="categorizeBtn">
                    <span class="icon">📂</span>
                    <span class="text">Kategorisieren</span>
                    <span class="shortcut">Strg+Alt+C</span>
                </button>
                
                <button class="button" id="importanceBtn">
                    <span class="icon">⚡</span>
                    <span class="text">Wichtigkeit prüfen</span>
                </button>
                
                <button class="button" id="chatBtn">
                    <span class="icon">💬</span>
                    <span class="text">AI Chat</span>
                </button>
                
                <button class="button test" id="testBtn">
                    <span class="icon">🧪</span>
                    <span class="text">Test Button</span>
                </button>
            </div>
        </div>

        <div class="section">
            <h2>📧 E-Mail Details</h2>
            <div class="email-info">
                <div class="info-row">
                    <span class="info-label">Von:</span>
                    <span class="info-value" id="emailFrom">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Datum:</span>
                    <span class="info-value" id="emailDate">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Größe:</span>
                    <span class="info-value" id="emailSize">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Status:</span>
                    <span class="info-value" id="emailStatus">-</span>
                </div>
            </div>
        </div>

        <div class="advanced-section">
            <button class="advanced-toggle" id="advancedToggle">
                <span>Erweiterte Optionen</span>
                <span>▼</span>
            </button>
            <div class="advanced-content" id="advancedContent">
                <div class="button-grid">
                    <button class="button" id="translateBtn">
                        <span class="icon">🌐</span>
                        <span class="text">Übersetzen</span>
                    </button>
                    <button class="button" id="extractInfoBtn">
                        <span class="icon">🔍</span>
                        <span class="text">Info extrahieren</span>
                    </button>
                    <button class="button" id="checkSpamBtn">
                        <span class="icon">🛡️</span>
                        <span class="text">Spam prüfen</span>
                    </button>
                    <button class="button" id="findSimilarBtn">
                        <span class="icon">🔗</span>
                        <span class="text">Ähnliche finden</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="results-area" id="resultsArea">
            <div class="results-title" id="resultsTitle">Ergebnis</div>
            <div class="results-content" id="resultsContent"></div>
            <div class="results-actions" id="resultsActions"></div>
        </div>

        <div class="footer-actions">
            <button class="footer-btn" id="settingsBtn">
                <span class="icon">⚙️</span>
                <span class="text">Einstellungen</span>
            </button>
            <button class="footer-btn" id="chatBtn">
                <span class="icon">💬</span>
                <span class="text">AI Chat</span>
            </button>
            <button class="footer-btn" id="helpBtn">
                <span class="icon">❓</span>
                <span class="text">Hilfe</span>
            </button>
        </div>

        <div class="status" id="status">
            Status: Bereit zum Testen
        </div>
        
        <div class="console-output" id="consoleOutput">
            Console-Ausgabe wird hier angezeigt...
        </div>
    </div>
    <script src="message-display.js"></script>
</body>
</html>
