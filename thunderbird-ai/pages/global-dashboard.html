<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="dashboardPageTitle"></title>
    <link rel="stylesheet" href="score-feedback-editor.css">
    <link rel="stylesheet" href="global-dashboard.css">
</head>
<body>
    <main class="dashboard">
        <header class="dashboard-header">
            <img src="icon.svg" alt="" width="44" height="44">
            <div>
                <h1 data-i18n="dashboardTitle"></h1>
                <p data-i18n="dashboardIntroduction"></p>
            </div>
        </header>
        <div class="dashboard-actions">
            <button type="button" id="dashboardRefresh" data-i18n="dashboardRefresh"></button>
            <button type="button" id="dashboardSettings" data-i18n="dashboardSettings"></button>
        </div>
        <details id="dashboardDisplayOptions" class="dashboard-display-options" open>
            <summary id="dashboardDisplayOptionsHeading" class="dashboard-display-options-summary">
                <span data-i18n="dashboardDisplayOptions"></span>
            </summary>
            <div class="dashboard-display-options-content">
                <div class="dashboard-option-groups">
                    <fieldset class="dashboard-option-group dashboard-option-group-layout">
                        <legend data-i18n="dashboardLayoutGroup"></legend>
                        <div class="dashboard-query-controls">
                            <label class="dashboard-view-mode">
                                <span data-i18n="dashboardViewMode"></span>
                                <select id="dashboardViewMode">
                                    <option value="account" data-i18n="dashboardViewByAccount"></option>
                                    <option value="combined" data-i18n="dashboardViewCombined"></option>
                                </select>
                            </label>
                            <label>
                                <span data-i18n="dashboardSortOrder"></span>
                                <select id="dashboardSortOrder">
                                    <option value="date-desc" data-i18n="dashboardSortNewest"></option>
                                    <option value="date-asc" data-i18n="dashboardSortOldest"></option>
                                    <option value="sender-asc" data-i18n="dashboardSortSenderAscending"></option>
                                    <option value="sender-desc" data-i18n="dashboardSortSenderDescending"></option>
                                    <option value="importance-desc" data-i18n="dashboardSortImportanceDescending"></option>
                                    <option value="importance-asc" data-i18n="dashboardSortImportanceAscending"></option>
                                    <option value="spam-desc" data-i18n="dashboardSortSpamDescending"></option>
                                    <option value="spam-asc" data-i18n="dashboardSortSpamAscending"></option>
                                    <option value="risk-desc" data-i18n="dashboardSortRiskDescending"></option>
                                    <option value="risk-asc" data-i18n="dashboardSortRiskAscending"></option>
                                    <option value="importance-global-desc" data-i18n="dashboardSortImportanceGlobalDescending"></option>
                                    <option value="importance-global-asc" data-i18n="dashboardSortImportanceGlobalAscending"></option>
                                    <option value="spam-global-desc" data-i18n="dashboardSortSpamGlobalDescending"></option>
                                    <option value="spam-global-asc" data-i18n="dashboardSortSpamGlobalAscending"></option>
                                    <option value="risk-global-desc" data-i18n="dashboardSortRiskGlobalDescending"></option>
                                    <option value="risk-global-asc" data-i18n="dashboardSortRiskGlobalAscending"></option>
                                </select>
                            </label>
                            <label>
                                <span id="dashboardMessageLimitLabel" data-i18n="dashboardMessageLimit"></span>
                                <input type="number" id="dashboardMessageLimit" min="1" max="50" step="1" inputmode="numeric">
                            </label>
                        </div>
                        <p id="dashboardLimitHint" class="dashboard-option-hint" data-i18n="dashboardLimitHint"></p>
                    </fieldset>

                    <fieldset class="dashboard-option-group dashboard-option-group-filter">
                        <legend data-i18n="dashboardFilterGroup"></legend>
                        <div class="dashboard-query-controls">
                            <label>
                                <span data-i18n="dashboardDateFrom"></span>
                                <input type="date" id="dashboardDateFrom">
                            </label>
                            <label>
                                <span data-i18n="dashboardDateTo"></span>
                                <input type="date" id="dashboardDateTo">
                            </label>
                            <details id="dashboardSenderFilter" class="dashboard-sender-filter">
                                <summary id="dashboardSenderSummary" data-i18n="dashboardSenderFilter"></summary>
                                <div id="dashboardSenderOptions" class="dashboard-sender-options"></div>
                            </details>
                        </div>
                    </fieldset>

                    <fieldset class="dashboard-option-group dashboard-option-group-preview">
                        <legend data-i18n="dashboardPreviewGroup"></legend>
                        <div class="dashboard-display-controls">
                            <label>
                                <input type="checkbox" id="dashboardShowPreview">
                                <span data-i18n="dashboardShowPreview"></span>
                            </label>
                            <label for="dashboardPreviewLines" data-i18n="dashboardPreviewLines"></label>
                            <input type="number" id="dashboardPreviewLines" min="1" max="20" step="1" inputmode="numeric">
                        </div>
                        <p class="dashboard-option-hint" data-i18n="dashboardPreviewPrivacy"></p>
                    </fieldset>

                    <fieldset class="dashboard-option-group dashboard-option-group-ai">
                        <legend data-i18n="dashboardAIFilterGroup"></legend>
                        <div class="dashboard-query-controls">
                            <label class="dashboard-ai-status-filter">
                                <span data-i18n="dashboardAIStatusFilter"></span>
                                <select id="dashboardAIStatusFilter">
                                    <option value="all" data-i18n="dashboardAIStatusAll"></option>
                                    <option value="analyzed" data-i18n="dashboardAIStatusAnalyzed"></option>
                                    <option value="unanalyzed" data-i18n="dashboardAIStatusUnanalyzed"></option>
                                    <option value="probably-spam" data-i18n="dashboardAIStatusProbablySpam"></option>
                                    <option value="probably-not-spam" data-i18n="dashboardAIStatusProbablyNotSpam"></option>
                                    <option value="probably-risky" data-i18n="dashboardAIStatusProbablyRisky"></option>
                                    <option value="probably-low-risk" data-i18n="dashboardAIStatusProbablyLowRisk"></option>
                                </select>
                            </label>
                            <label>
                                <span data-i18n="dashboardImportanceMinimum"></span>
                                <input type="number" id="dashboardImportanceMinimum" min="0" max="100" step="1" inputmode="numeric">
                            </label>
                            <label>
                                <span data-i18n="dashboardSpamMinimum"></span>
                                <input type="number" id="dashboardSpamMinimum" min="0" max="100" step="1" inputmode="numeric">
                            </label>
                            <label>
                                <span data-i18n="dashboardRiskMinimum"></span>
                                <input type="number" id="dashboardRiskMinimum" min="0" max="100" step="1" inputmode="numeric">
                            </label>
                        </div>
                        <p class="dashboard-option-hint" data-i18n="dashboardAIThresholdHint"></p>
                        <details class="dashboard-option-explanation">
                            <summary data-i18n="dashboardAIPrivacySummary"></summary>
                            <p data-i18n="dashboardAIPrivacy"></p>
                        </details>
                    </fieldset>
                </div>
            </div>
        </details>
        <p id="dashboardStatus" class="dashboard-status" role="status" aria-live="polite"></p>
        <details id="dashboardDiagnostics" class="dashboard-diagnostics" hidden>
            <summary data-i18n="dashboardDiagnosticsTitle"></summary>
            <pre id="dashboardDiagnosticDetails"></pre>
            <button type="button" id="dashboardCopyDiagnostics" data-i18n="dashboardCopyDiagnostics"></button>
        </details>
        <div id="dashboardLoadingIndicator" class="dashboard-loading" role="status" aria-live="polite" hidden>
            <span class="dashboard-spinner" aria-hidden="true"></span>
            <span id="dashboardLoadingText"></span>
        </div>
        <div class="dashboard-bulk-actions">
            <div class="dashboard-bulk-selection">
                <label>
                    <input type="checkbox" id="dashboardSelectAll">
                    <span data-i18n="dashboardSelectAll"></span>
                </label>
                <span id="dashboardSelectedCount" class="dashboard-selected-count"></span>
            </div>
            <div class="dashboard-bulk-action-groups">
                <div class="dashboard-bulk-action-group ai" role="group" aria-labelledby="dashboardBulkAIHeading">
                    <span id="dashboardBulkAIHeading" class="dashboard-action-group-title" data-i18n="dashboardAIActionsGroup"></span>
                    <button type="button" id="dashboardAnalyzeSelected" class="dashboard-bulk-action dashboard-analyze-selected">
                        <span class="dashboard-action-icon" aria-hidden="true">✨</span>
                        <span data-i18n="dashboardAnalyzeSelected"></span>
                    </button>
                    <button type="button" id="dashboardRescoreSelected" class="dashboard-bulk-action dashboard-rescore-selected">
                        <span class="dashboard-action-icon" aria-hidden="true">↻</span>
                        <span data-i18n="dashboardRescoreSelected"></span>
                    </button>
                </div>
                <div class="dashboard-bulk-action-group mail" role="group" aria-labelledby="dashboardBulkMailHeading">
                    <span id="dashboardBulkMailHeading" class="dashboard-action-group-title" data-i18n="dashboardMailActionsGroup"></span>
                    <button type="button" id="dashboardMarkReadSelected" class="dashboard-bulk-action dashboard-mark-read">
                        <span class="dashboard-action-icon" aria-hidden="true">✓</span>
                        <span data-i18n="dashboardMarkReadSelected"></span>
                    </button>
                    <button type="button" id="dashboardArchiveSelected" class="dashboard-bulk-action dashboard-archive">
                        <span class="dashboard-action-icon" aria-hidden="true">📦</span>
                        <span data-i18n="dashboardArchiveSelected"></span>
                    </button>
                    <button type="button" id="dashboardTrashSelected" class="dashboard-bulk-action dashboard-danger-action">
                        <span class="dashboard-action-icon" aria-hidden="true">🗑️</span>
                        <span data-i18n="dashboardTrashSelected"></span>
                    </button>
                </div>
            </div>
        </div>
        <div id="dashboardAccounts" class="dashboard-accounts"></div>
    </main>
    <dialog id="dashboardConfirmationDialog" class="dashboard-confirmation-dialog">
        <form method="dialog">
            <div class="dashboard-confirmation-heading">
                <span class="dashboard-confirmation-symbol" aria-hidden="true">🗑️</span>
                <h2 data-i18n="dashboardConfirmationTitle"></h2>
            </div>
            <p id="dashboardConfirmationMessage" class="dashboard-confirmation-message"></p>
            <div class="dashboard-confirmation-actions">
                <button type="submit" value="cancel" class="dashboard-confirmation-cancel">
                    <span class="dashboard-confirmation-button-icon" aria-hidden="true">✕</span>
                    <span data-i18n="dashboardConfirmationCancel"></span>
                </button>
                <button type="submit" value="confirm" class="dashboard-confirmation-delete">
                    <span class="dashboard-confirmation-button-icon" aria-hidden="true">🗑️</span>
                    <span data-i18n="dashboardConfirmationDelete"></span>
                </button>
            </div>
        </form>
    </dialog>
    <dialog id="dashboardFeedbackDialog" class="dashboard-feedback-dialog">
        <form id="dashboardFeedbackForm" method="dialog">
            <h2 data-i18n="dashboardFeedbackTitle"></h2>
            <p id="dashboardFeedbackSubject" class="dashboard-feedback-subject"></p>
            <div id="dashboardFeedbackEditors" class="dashboard-feedback-editors"></div>
            <p class="dashboard-feedback-privacy" data-i18n="dashboardFeedbackPrivacy"></p>
            <p id="dashboardFeedbackStatus" class="dashboard-feedback-status" role="alert"></p>
            <div class="dashboard-feedback-actions">
                <button type="button" id="dashboardFeedbackCancel" data-i18n="dashboardFeedbackCancel"></button>
                <button type="submit" id="dashboardFeedbackSubmit" data-i18n="dashboardFeedbackSave"></button>
            </div>
        </form>
    </dialog>
    <script src="locale-de.js"></script>
    <script src="locale-en.js"></script>
    <script src="constants.js"></script>
    <script src="retry.js"></script>
    <script src="message.js"></script>
    <script src="GlobalMailService.js"></script>
    <script src="GlobalMailViewService.js"></script>
    <script src="DashboardViewPreferences.js"></script>
    <script src="DashboardSenderFilterComponent.js"></script>
    <script src="DashboardAIService.js"></script>
    <script src="DashboardMessageComponent.js"></script>
    <script src="DashboardDeleteComponent.js"></script>
    <script src="ScoreFeedbackEditor.js"></script>
    <script src="DashboardFeedbackComponent.js"></script>
    <script src="GlobalDashboardManager.js"></script>
    <script src="global-dashboard.js"></script>
</body>
</html>
