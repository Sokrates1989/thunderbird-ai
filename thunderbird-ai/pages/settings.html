<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thunderbird AI - Einstellungen</title>
    <link rel="stylesheet" href="settings.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚙️ Einstellungen</h1>
            <p>Konfigurieren Sie Ihren Thunderbird AI Assistant</p>
        </div>

        <!-- Modular sections - each will be managed by its own component -->
        <div id="api-config-section" class="settings-section">
            <!-- API Configuration will be loaded here -->
        </div>

        <div id="automation-section" class="settings-section">
            <!-- Automation settings will be loaded here -->
        </div>

        <div id="api-test-section" class="settings-section">
            <!-- API Test will be loaded here -->
        </div>

        <div id="statistics-section" class="settings-section">
            <!-- Statistics will be loaded here -->
        </div>

        <div id="saved-results-section" class="settings-section">
            <!-- Saved results will be loaded here -->
        </div>

        <div id="actions-section" class="actions">
            <!-- Action buttons will be loaded here -->
        </div>

        <div class="status" id="status"></div>
    </div>

    <!-- Load utility modules first -->
    <script src="constants.js"></script>
    <script src="storage.js"></script>
    <script src="openai.js"></script>
    <script src="message.js"></script>
    <script src="ui.js"></script>
    
    <!-- Load UI components -->
    <script src="ApiConfigComponent.js"></script>
    <script src="AutomationComponent.js"></script>
    <script src="ApiTestComponent.js"></script>
    <script src="StatisticsComponent.js"></script>
    <script src="SavedResultsComponent.js"></script>
    <script src="ActionsComponent.js"></script>
    
    <!-- Load main settings manager -->
    <script src="SettingsManager.js"></script>
    
    <!-- Load entry point last -->
    <script src="settingsEntry.js"></script>
</body>
</html>
